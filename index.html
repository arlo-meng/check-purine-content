<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>嘌呤速查</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="嘌呤速查">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/healthy-food-calories-calculator.png">

    <style>
        :root {
            --ios-blue: #007AFF;
            --bg-gray: #F2F2F7;
            --danger: #FF3B30;
            --warning: #FF9500;
            --success: #34C759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 固定在顶部的搜索栏 */
        .header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
            z-index: 100;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            height: 38px;
            padding: 0 15px 0 35px;
            border-radius: 10px;
            border: none;
            background-color: #E3E3E6;
            font-size: 16px;
            outline: none;
        }

        /* 搜索框内的放大镜图标 */
        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 10px;
            font-size: 14px;
            color: #8E8E93;
        }

        /* 列表区域 */
        .list-container {
            padding: 10px 15px;
        }

        .food-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .food-card:active {
            background: #E5E5EA;
        }

        .food-name {
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        .purine-info {
            text-align: right;
        }

        .purine-value {
            font-size: 18px;
            font-weight: 700;
            font-family: "SF Pro Text", sans-serif;
        }

        .unit {
            font-size: 12px;
            font-weight: 400;
            color: #8E8E93;
            margin-left: 2px;
        }

        /* 自动分色逻辑 */
        .high { color: var(--danger); }
        .mid { color: var(--warning); }
        .low { color: var(--success); }

        .empty-state {
            text-align: center;
            color: #8E8E93;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="模糊搜索食物名称..." autocomplete="off">
        </div>
    </div>

    <div class="list-container" id="listContainer">
        </div>

    <script>
        /**
         * 5、由你提供的食物数据
         * 你可以直接在这里修改或扩展
         */
        const myFoodList = [
            { name: "白带鱼", purine: 391 },
            { name: "干贝", purine: 390 },
            { name: "猪肝", purine: 275 },
            { name: "秋刀鱼", purine: 355 },
            { name: "草虾", purine: 162 },
            { name: "鸭肉", purine: 178 },
            { name: "猪肉", purine: 132 },
            { name: "牛肉", purine: 110 },
            { name: "西兰花", purine: 21 },
            { name: "土豆", purine: 13 },
            { name: "鸡蛋", purine: 0.4 },
            { name: "牛奶", purine: 1.4 }
        ];

        const searchInput = document.getElementById('searchInput');
        const listContainer = document.getElementById('listContainer');

        function getLevelClass(val) {
            if (val > 150) return 'high';
            if (val >= 25) return 'mid';
            return 'low';
        }

        function renderList(data) {
            listContainer.innerHTML = '';
            if (data.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">未找到匹配的食物</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                    <div class="food-name">${item.name}</div>
                    <div class="purine-info">
                        <span class="purine-value ${getLevelClass(item.purine)}">${item.purine}</span>
                        <span class="unit">mg/100g</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 模糊搜索逻辑
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            const filtered = myFoodList.filter(item => 
                item.name.toLowerCase().includes(keyword)
            );
            renderList(filtered);
        });

        // 初始加载全部
        renderList(myFoodList);
    </script>
</body>
</html>
